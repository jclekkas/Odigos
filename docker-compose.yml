# Quote analysis only needs an OpenAI-compatible key.
# Postgres is optional and stays off unless you enable the with-db profile:
#   docker compose --profile with-db up --build

services:
  app:
    build: .
    ports:
      - "5000:5000"
    environment:
      PORT: "5000"
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-}
      OPENAI_FALLBACK_MODEL: ${OPENAI_FALLBACK_MODEL:-}
      DATABASE_URL: ${DATABASE_URL:-}
      # Blank is the same as unset: the email-a-copy button stays hidden.
      EMAIL_TOKEN_SECRET: ${EMAIL_TOKEN_SECRET:-}
      SESSION_SECRET: ${SESSION_SECRET:-}
      # Blank or whitespace is the same as unset: no emailToken, form stays hidden.
      ALERT_SMTP_URL: ${ALERT_SMTP_URL:-}
    restart: unless-stopped

  db:
    image: postgres:16
    profiles: ["with-db"]
    environment:
      POSTGRES_USER: odigos
      POSTGRES_PASSWORD: odigos
      POSTGRES_DB: odigos
    ports:
      - "5432:5432"
    volumes:
      - odigos-pg:/var/lib/postgresql/data

volumes:
  odigos-pg:

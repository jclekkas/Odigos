<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 1200" width="1800" height="1200" role="img" aria-label="The dining room at Mamma Lena">
<defs>
<linearGradient id="bghero" x1="0" y1="0" x2="0.35" y2="1"><stop offset="0" stop-color="#4A2C1C"/><stop offset="1" stop-color="#160F0B"/></linearGradient>
<radialGradient id="glowhero" cx="0.32" cy="0.24" r="0.85"><stop offset="0" stop-color="#E8A15C" stop-opacity="0.55"/><stop offset="0.55" stop-color="#E8A15C" stop-opacity="0.14"/><stop offset="1" stop-color="#E8A15C" stop-opacity="0"/></radialGradient>
<radialGradient id="vighero" cx="0.5" cy="0.48" r="0.78"><stop offset="0.45" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity="0.55"/></radialGradient>
<filter id="softhero60" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="60"/></filter><filter id="softhero66" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="66"/></filter><filter id="softhero70" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="70"/></filter><filter id="softhero80" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="80"/></filter>

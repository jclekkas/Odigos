<ellipse cx="396" cy="360" rx="288" ry="168" fill="#FFD9A0" opacity="0.3" filter="url(#softhero70)"/><ellipse cx="1224" cy="432" rx="198" ry="120" fill="#FFD9A0" opacity="0.22" filter="url(#softhero66)"/><ellipse cx="900" cy="1032" rx="1116" ry="240" fill="#000000" opacity="0.4" filter="url(#softhero80)"/><ellipse cx="900" cy="840" rx="792" ry="120" fill="#FFFFFF" opacity="0.07" filter="url(#softhero60)"/>

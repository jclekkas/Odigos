name: Bug report
description: Something in the analyzer, the site, or a self-hosted install is wrong.
title: ""
labels: []
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: Remove names, phone numbers, email addresses, and street addresses from any dealer text you paste.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: input
    id: state
    attributes:
      label: State, if the quote was for one
      placeholder: CA
  - type: dropdown
    id: where
    attributes:
      label: Where
      options:
        - odigosauto.com
        - Local or Docker install
        - Not sure
    validations:
      required: true
